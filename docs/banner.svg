<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Dulf's Plant Hydration Hub</title>
  <desc id="desc">ESP32 soil moisture to Raspberry Pi, live home PWA, and public Streamlit portfolio</desc>
  <defs>
    <linearGradient id="ph-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F8F0"/>
      <stop offset="100%" stop-color="#E4EBD8"/>
    </linearGradient>
    <linearGradient id="ph-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D5A3D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2D5A3D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2D5A3D" stop-opacity="0"/>
    </linearGradient>
    <filter id="ph-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14532D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#ph-paper)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5" fill="none" stroke="#C9D6B8"/>
  <g stroke="#C9D6B8" stroke-width="1" opacity="0.55">
    <path d="M80 0v420M160 0v420M1040 0v420M1120 0v420"/>
    <path d="M0 80h1200M0 340h1200"/>
  </g>
  <rect x="360" y="0" width="480" height="8" fill="url(#ph-glow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif">
    <text x="88" y="112" font-size="36" font-weight="700" letter-spacing="-1" fill="#2D5A3D">Plant Hydration</text>
    <text x="88" y="156" font-size="36" font-weight="700" fill="#4A7C4A">Hub</text>
    <line x1="88" y1="174" x2="268" y2="174" stroke="#C45C3E" stroke-width="3.5" stroke-linecap="round"/>
    <text x="88" y="214" font-size="18" fill="#4A5D4A">ESP32 soil probe → Raspberry Pi → live PWA + public demo.</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="88" y="244" width="92" height="32" rx="16" fill="#FFFFFF" stroke="#C9D6B8"/>
    <circle cx="108" cy="260" r="5" fill="#00979D"/>
    <text x="122" y="265" fill="#2D5A3D">ESP32</text>
    <rect x="190" y="244" width="128" height="32" rx="16" fill="#FFFFFF" stroke="#C9D6B8"/>
    <circle cx="210" cy="260" r="5" fill="#A22846"/>
    <text x="224" y="265" fill="#2D5A3D">Raspberry Pi</text>
    <rect x="328" y="244" width="86" height="32" rx="16" fill="#FFFFFF" stroke="#C9D6B8"/>
    <circle cx="348" cy="260" r="5" fill="#C45C3E"/>
    <text x="362" y="265" fill="#2D5A3D">PWA</text>
  </g>

  <g transform="translate(680,64)" filter="url(#ph-soft)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect width="436" height="292" rx="20" fill="#FFFFFF" stroke="#C9D6B8"/>
    <!-- plant -->
    <g transform="translate(48,36)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-4 64 48; 4 64 48; -4 64 48" dur="3.5s" repeatCount="indefinite"/>
        <path d="M64 8c4 16 16 28 32 32-16 4-28 16-32 32-4-16-16-28-32-32 16-4 28-16 32-32z" fill="#C4E07A"/>
        <path d="M64 40v40" stroke="#2D5A3D" stroke-width="6" stroke-linecap="round"/>
      </g>
      <path d="M46 88h36c4 0 7 3 7 7v8H39v-8c0-4 3-7 7-7z" fill="#C45C3E"/>
      <text x="64" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5D4A">Gynura Aurantiaca</text>
    </g>
    <!-- moisture ring -->
    <g transform="translate(230,48)">
      <circle cx="70" cy="70" r="58" fill="none" stroke="#E8F0DC" stroke-width="14"/>
      <circle cx="70" cy="70" r="58" fill="none" stroke="#2D5A3D" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="273" stroke-dashoffset="82" transform="rotate(-90 70 70)"/>
      <text x="70" y="66" text-anchor="middle" font-size="28" font-weight="800" fill="#2D5A3D">72%</text>
      <text x="70" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#4A7C4A">Optimal</text>
    </g>
    <g transform="translate(24,200)">
      <rect width="388" height="68" rx="14" fill="#F5F8F0" stroke="#C9D6B8"/>
      <text x="18" y="28" font-size="13" font-weight="700" fill="#2D5A3D">ESP32</text>
      <text x="90" y="28" font-size="13" fill="#64748B">→</text>
      <text x="112" y="28" font-size="13" font-weight="700" fill="#2D5A3D">Pi API</text>
      <text x="176" y="28" font-size="13" fill="#64748B">→</text>
      <text x="198" y="28" font-size="13" font-weight="700" fill="#2D5A3D">Home PWA</text>
      <text x="18" y="50" font-size="12" fill="#4A5D4A">30-min posts → SQLite → public Streamlit snapshot</text>
    </g>
  </g>
</svg>
